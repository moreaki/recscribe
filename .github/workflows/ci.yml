name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: xcode-27
    # Complete functional + sanitizer evidence took 19m 37s in run 170.
    # Leave headroom for the added coverage cases and result-artifact upload.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify complete change set
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BASE: ${{ github.event.before }}
        run: python3 scripts/ci-scope.py
      - name: Select pinned compiler
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer"
          ./scripts/check-toolchain.sh
      - name: Retired-reference boundary
        run: |
          python3 scripts/check-source-boundary.py --self-test
          python3 -m unittest discover -s scripts/tests -p 'test_source_boundary.py'
          python3 -m unittest discover -s scripts/tests -p 'test_work_artifacts.py'
          python3 -m unittest discover -s scripts/tests -p 'test_ci_scope.py'
          python3 scripts/check-source-boundary.py
      - name: Native core and frozen contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_native_core_supervisor.py'
          python3 scripts/work-artifacts.py run --label native-core test -- python3 scripts/run-native-core-tests.py
      - name: Offline Whisper quality tooling
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_quality_*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_ggml_weights.py'
      - name: Verify PCM storage ownership and sanitizer evidence checks
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_sanitizer_results.py'
          python3 scripts/check-pcm-storage.py
      - name: Focused presentation contracts
        if: steps.scope.outputs.mode == 'focused'
        run: |
          xcodebuild test -project RecScribe/RecScribe.xcodeproj -scheme RecScribe \
            -destination 'platform=macOS' \
            -only-testing:RecScribeTests/RecordingReviewNotesTests \
            -only-testing:RecScribeTests/OverflowMenuTests \
            -only-testing:RecScribeTests/AudioRoutingSummaryTests \
            -only-testing:RecScribeTests/RoutingControlsTests \
            -only-testing:RecScribeTests/RecordingBulkDeletionTests \
            -only-testing:RecScribeTests/RecordingSessionTests \
            -parallel-testing-enabled NO -parallel-testing-worker-count 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults-functional.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Functional app contracts
        if: steps.scope.outputs.mode != 'focused'
        run: |
          xcodebuild test -project RecScribe/RecScribe.xcodeproj -scheme RecScribe \
            -destination 'platform=macOS' -only-testing:RecScribeTests \
            -parallel-testing-enabled NO -parallel-testing-worker-count 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults-functional.xcresult CODE_SIGNING_ALLOWED=NO
      # #83 requires complete, warning-free instrumentation evidence.
      - name: Thread Sanitizer
        id: sanitizer
        if: steps.scope.outputs.mode != 'focused'
        run: |
          set -o pipefail
          xcodebuild test -project RecScribe/RecScribe.xcodeproj -scheme RecScribe \
            -destination 'platform=macOS' -only-testing:RecScribeTests \
            -parallel-testing-enabled NO -parallel-testing-worker-count 1 \
            -enableThreadSanitizer YES -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee TestResults-tsan.log
      - name: Export result summaries
        if: always()
        run: |
          for result in TestResults-functional.xcresult TestResults.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool get test-results summary --path "$result" > "${result%.xcresult}.json" \
                || echo "::warning::Summary export unavailable for $result"
              xcrun xcresulttool export diagnostics --path "$result" --output-path "${result%.xcresult}-diagnostics" \
                || echo "::warning::Diagnostic export unavailable for $result"
            fi
          done
      - name: Verify focused test completion
        if: ${{ always() && steps.scope.outputs.mode == 'focused' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('TestResults-functional.json').read_text())
          assert result.get('result') == 'Passed' and result.get('failedTests') == 0, result
          assert result.get('passedTests', 0) > 0, 'Focused tests did not execute'
          PY
      - name: Reject sanitizer diagnostics and incomplete runs
        if: ${{ always() && steps.scope.outputs.mode != 'focused' }}
        run: python3 scripts/check-sanitizer-results.py TestResults.json TestResults-functional.json TestResults-tsan.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults*.xcresult
            TestResults*.json
            TestResults-tsan.log
            TestResults*-diagnostics/
            Build/Artifacts/test/*-native-core-*/native-core.log
            Build/Artifacts/test/*-native-core-*/native-core-supervision.json
            Build/Artifacts/test/*-native-core-*/native-sample-*.txt
            Build/Artifacts/test/*-native-core-*/console.log
          if-no-files-found: ignore

  release-build:
    name: Release build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select pinned compiler
        run: |
          sudo xcode-select -s "/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer"
          ./scripts/check-toolchain.sh
      - name: Compile optimized application
        run: |
          xcodebuild build -project RecScribe/RecScribe.xcodeproj -scheme RecScribe \
            -configuration Release -destination 'platform=macOS' -derivedDataPath Build/DerivedData CODE_SIGNING_ALLOWED=NO
          python3 scripts/check-source-boundary.py --bundle Build/DerivedData/Build/Products/Release/RecScribe.app
