name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    # Match local development's Xcode/SDK generation. Pin the minor version in
    # .xcode-version; the runner's default can differ (including RC builds).
    runs-on: xcode-27
    # Without this, GitHub's default is SIX HOURS. A single hung test then
    # quietly consumes the runner budget and leaves no log to diagnose from.
    # The suite completes in 2-3 minutes; 20 is generous headroom that still
    # fails fast.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ci_xcode_version="$(cat .xcode-version)"
          sudo xcode-select -s "/Applications/Xcode_${ci_xcode_version}.app/Contents/Developer"
          ./scripts/check-toolchain.sh

      - name: Run native audio/text, frozen reference and CLI tests
        run: xcrun swift test --package-path core

      - name: Verify PCM storage ownership and sanitizer evidence checks
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_sanitizer_results.py'
          python3 scripts/check-pcm-storage.py

      - name: Run unit tests (functional)
        # BLOCKING gate: full unit-test suite WITHOUT Thread Sanitizer. Covers all
        # correctness, including the AVAssetWriter-based encoder tests. No
        # TCC/Screen-Recording UI tests (can't run headless).
        run: |
          set -o pipefail
          xcodebuild test \
            -project RecScribe/RecScribe.xcodeproj \
            -scheme RecScribe \
            -destination 'platform=macOS' \
            -only-testing:RecScribeTests \
            -parallel-testing-enabled NO \
            -parallel-testing-worker-count 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -resultBundlePath TestResults-functional.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests (Thread Sanitizer)
        # Blocking after #83: fixture sample storage has an explicit, observable
        # lifetime. A green xcodebuild exit alone can hide a diagnostic/restart;
        # verify both the result bundle and complete captured log below.
        run: |
          set -o pipefail
          xcodebuild test \
            -project RecScribe/RecScribe.xcodeproj \
            -scheme RecScribe \
            -destination 'platform=macOS' \
            -only-testing:RecScribeTests \
            -parallel-testing-enabled NO \
            -parallel-testing-worker-count 1 \
            -enableThreadSanitizer YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee TestResults-tsan.log

      - name: Export test diagnostics
        if: always()
        run: |
          for bundle in TestResults-functional.xcresult TestResults.xcresult; do
            if [ -d "$bundle" ]; then
              stem="${bundle%.xcresult}"
              xcrun xcresulttool get test-results summary --path "$bundle" > "$stem.json" \
                || echo "::warning::Could not export summary for $bundle"
              xcrun xcresulttool export diagnostics --path "$bundle" --output-path "$stem-diagnostics" \
                || echo "::warning::Could not export diagnostics for $bundle"
            fi
          done

      - name: Reject sanitizer diagnostics and incomplete runs
        if: always()
        run: python3 scripts/check-sanitizer-results.py TestResults.json TestResults-functional.json TestResults-tsan.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            TestResults-functional.xcresult
            TestResults*.json
            TestResults-tsan.log
            TestResults*-diagnostics/
          if-no-files-found: ignore

  release-build:
    name: Release build
    # BLOCKING gate, and deliberately a SEPARATE JOB rather than a step after
    # the tests (BL-156). Everything in `unit-tests` is a Debug build, and
    # Release is not the same compilation: whole-module optimization and
    # `#if DEBUG` code is gone from it.
    #
    # That last difference shipped a defect. A `#Preview` in a vendored file
    # referenced fixtures guarded by `#if DEBUG`; every Debug build and the
    # whole test suite passed, and the archive failed with "cannot find
    # 'GlassSampleWaveforms' in scope" — found by hand, mid-release, after the
    # tag had been cut. A green suite said nothing about whether the product
    # could be built at all.
    #
    # As a trailing step it inherited that same blindness from the other side:
    # any test failure — including a flaky one — skipped it, so exactly when
    # the tree was in doubt, nobody learned whether it still built. That
    # happened on `main` at 66d0702. A separate job has no `needs:`, so the two
    # gates fail independently and both always report.
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ci_xcode_version="$(cat .xcode-version)"
          sudo xcode-select -s "/Applications/Xcode_${ci_xcode_version}.app/Contents/Developer"
          ./scripts/check-toolchain.sh

      - name: Release build
        run: |
          set -o pipefail
          xcodebuild build \
            -project RecScribe/RecScribe.xcodeproj \
            -scheme RecScribe \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

# NOT ADDED, deliberately: a job running `scripts/check-docs.sh`.
# It cannot pass on a clean checkout. Most of what it verifies lives in
# CLAUDE.md, which is gitignored, so on CI the file is absent and the script
# exits 1 on a missing-file error rather than on any disagreement about the
# code. It already skips its private/tech-debt.md section when that file is
# absent; the CLAUDE.md section needs the same treatment before this is worth a
# job, and the residue that would actually run here is only the rot guards.
# Adding it as-is would pin CI red permanently — the failure this file's other
# changes exist to remove.
