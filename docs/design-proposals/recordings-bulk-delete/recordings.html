<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RecScribe · Recording selection and deletion proposal</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#1b1d25;--field:#292c36;--line:#30333d;--text:#e8e9ef;--dim:#a6a9b5;--blue:#8bbdff;--mint:#7bdcc5;--red:#ff999d;--yellow:#f0ca87;--selected:#1b2b40}
*{box-sizing:border-box}body{margin:0;background:#090a0e;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}button,input,select{font:inherit}button,select{color:inherit;background:var(--field);border:1px solid #424650;border-radius:7px;padding:6px 12px;cursor:pointer}button:hover:enabled{filter:brightness(1.18)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}input[type=checkbox],input[type=radio]{width:17px;height:17px;accent-color:#80b6ff;flex-shrink:0;cursor:pointer}h1,h2,p{margin:0}h1{font-size:23px;line-height:1.3;letter-spacing:-.45px}h2{font-size:20px;line-height:1.35;letter-spacing:-.3px}.dim{color:var(--dim)}.review{max-width:1080px;margin:0 auto 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.review strong{font-size:13px;font-weight:500}.review label{margin-left:auto}.review select{margin-left:8px}.review p{flex-basis:100%;color:var(--dim);font-size:12px}.app{position:relative;max-width:1080px;margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-height:690px}.chrome{height:43px;display:flex;align-items:center;padding:0 18px;gap:7px;border-bottom:1px solid var(--line);background:#171920}.dot{width:10px;height:10px;border:1px solid #555866;border-radius:50%;background:#343740}.chrome span:last-child{margin:auto;font-size:12px;color:var(--dim);padding-right:45px}.content{padding:30px 30px 0}.heading{display:flex;align-items:center;gap:13px;margin-bottom:25px}.library-icon{display:grid;place-items:center;width:45px;height:45px;background:#1e302f;color:var(--mint);border-radius:11px;font-size:24px}.heading p{font-size:13px;margin-top:3px;color:var(--dim)}.heading .tools{margin-left:auto;display:flex;gap:8px}.quiet{background:transparent;border-color:transparent;color:var(--blue)}.tools button{font-size:12px}.toolbar{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:12px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:59px;background:var(--bg);z-index:2}.master{display:flex;align-items:center;gap:12px;cursor:pointer}.selected-count{font-weight:600}.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}.danger{color:var(--red);border-color:#6c3f48;background:#352127}.row{position:relative;display:flex;align-items:flex-start;gap:14px;padding:20px 8px;border-bottom:1px solid var(--line)}.row.chosen{background:var(--selected);box-shadow:inset 3px 0 var(--blue)}.row>input{margin-top:10px}.wave{background:#1d2836;color:var(--blue);border-radius:8px;width:37px;height:37px;display:grid;place-items:center;font-size:23px;flex-shrink:0}.record{min-width:0;flex:1}.title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:var(--dim);margin-top:3px}.badge{font-size:11px;color:#bbc5d6;margin-left:8px;font-weight:400}.row-actions{display:flex;align-items:center;gap:3px;margin-left:auto;padding-top:2px}.row-actions button{font-size:12px;padding:5px 9px}.row-actions .play{font-size:15px}.notes{margin-top:7px;font-size:12px;color:var(--yellow)}.notes summary{cursor:pointer;display:list-item;list-style-position:inside}.notes p{max-width:560px;margin-top:8px;color:var(--dim)}.footer{display:flex;align-items:center;gap:10px;padding:18px 0;color:var(--dim);font-size:12px;min-height:60px}.footer .end{margin-left:auto}.banner{padding:11px 14px;background:#342b1f;color:var(--yellow);border-radius:7px;font-size:13px;margin-bottom:16px}.empty{text-align:center;padding:100px 20px 120px}.empty p{margin:8px 0 18px;color:var(--dim)}.menu{position:absolute;right:8px;top:55px;z-index:5;min-width:200px;background:#252832;border:1px solid #494e5c;padding:6px;border-radius:9px;box-shadow:0 12px 30px #0008}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent}.menu hr{border:0;border-top:1px solid var(--line)}.shade{position:absolute;inset:43px 0 0;z-index:6;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}.sheet{background:#20222b;border:1px solid #505461;border-radius:15px;box-shadow:0 25px 70px #0009;padding:27px;width:534px;max-width:100%;max-height:100%;overflow:auto}.sheet .lead{margin:8px 0 20px;color:var(--dim);font-size:13px}.choices{display:grid;gap:10px}.option{display:flex;gap:10px;padding:13px;border:1px solid #464a55;border-radius:9px;cursor:pointer}.option.active{background:#25354a;border-color:var(--blue)}.option input{margin-top:3px}.option strong{display:block;font-size:14px;font-weight:600}.option p{font-size:12px;color:var(--dim);margin-top:3px}.scope{font-size:12px;color:var(--dim);margin:15px 0}.scope summary{color:var(--blue);cursor:pointer}.scope ul{padding-left:20px;margin:8px 0}.safe{display:flex;gap:9px;color:var(--dim);font-size:12px;margin:17px 0 20px}.safe strong{color:var(--text);font-weight:500}.sheet-actions{display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--line);padding-top:17px}.sheet-actions .danger{background:#b6424e;color:#fff;border-color:#d15a65}.sheet .warning{margin:14px 0;background:#352d22;border-radius:8px;padding:11px;font-size:12px;color:var(--yellow)}.result{margin-bottom:18px;padding:14px 16px;border:1px solid #504636;border-radius:9px;background:#26231e;font-size:13px}.result strong{display:block}.result p{color:var(--dim);font-size:12px;margin-top:4px}.result button{padding:4px 0;margin-top:5px}.progress{height:5px;border-radius:5px;background:#3d424e;margin:22px 0 10px;overflow:hidden}.progress span{display:block;width:45%;height:100%;background:var(--blue)}.loading-actions{display:flex;justify-content:flex-end;margin-top:25px}.sheet .subtitle{font-size:13px;color:var(--dim);margin-top:10px}.exception-list{margin:10px 0 0;padding-left:18px}.exception-list li{margin-top:6px}.nowrap{white-space:nowrap}
@media(max-width:760px){body{padding:12px}.content{padding:22px 18px 0}.heading{flex-wrap:wrap;gap:10px}.heading .tools{width:100%;margin-left:55px}.row{gap:10px;padding:18px 7px}.wave{display:none}.row-actions .transcribe{display:none}.title{white-space:normal;overflow-wrap:anywhere}.badge{display:block;margin-left:0}.toolbar{gap:8px}.toolbar .right{gap:3px}.toolbar button{font-size:12px;padding:6px 9px}.footer{flex-wrap:wrap}.footer .end{margin-left:0}.sheet{padding:21px}.shade{padding:12px}.review label{margin-left:0}.app{min-height:760px}}
</style>
<div class="review"><strong>Design proposal · Recordings</strong><label>Preview state<select id="scene"><option value="browse">Browse</option><option value="selected">A few selected</option><option value="all">All selected</option><option value="confirm">Delete confirmation</option><option value="exceptions">Data kept for review</option><option value="progress">Deletion in progress</option><option value="result">Partial completion</option><option value="blocked">Capture active</option><option value="empty">Empty library</option></select></label><p>Interactive mock · Synthetic recording metadata · No files are read, changed or deleted. Change preview state to reset the demo.</p></div>
<main class="app" id="app" aria-label="RecScribe Recordings proposal"></main>
<script>
(()=>{
const app=document.getElementById('app'),scene=document.getElementById('scene');
const initial=[
{id:1,title:'Recording · 5 Nov 2026 at 10:14:57',time:'Today, 10:14',duration:'2m 41s',jobs:2},
{id:2,title:'Recording · 5 Nov 2026 at 10:11:03',time:'Today, 10:11',duration:'1m 25s',jobs:1,review:true},
{id:3,title:'Recording · 5 Nov 2026 at 07:39:50',time:'Today, 07:39',duration:'2.5s',jobs:0},
{id:4,title:'Recording · 5 Nov 2026 at 07:39:20',time:'Today, 07:39',duration:'2.6s',jobs:0},
{id:5,title:'Recording · 5 Nov 2026 at 07:39:16',time:'Today, 07:39',duration:'3.1s',jobs:1}
];
let rows=[],selected=new Set(),modal=false,scope='audio',menu=null,blocked=false,exceptions=false,result=false,progress=false,toast='',anchor=null,returnFocus=null,timer;
function setScene(s){clearTimeout(timer);rows=initial.map(x=>({...x}));selected=new Set();modal=false;scope='audio';menu=null;blocked=s==='blocked';exceptions=s==='exceptions';result=s==='result';progress=s==='progress';toast='';anchor=null;
if(['selected','confirm','exceptions','progress','blocked'].includes(s))selected=new Set([1,2,3]);if(s==='all')selected=new Set(rows.map(x=>x.id));if(['confirm','exceptions','progress'].includes(s))modal=true;if(s==='exceptions')scope='linked';if(s==='result'){rows=rows.filter(x=>![1,2].includes(x.id));selected=new Set([3])}if(s==='empty')rows=[];render()}
const jobs=()=>rows.filter(x=>selected.has(x.id)).reduce((n,x)=>n+x.jobs,0);
function row(r){const chosen=selected.has(r.id);return `<article class="row ${chosen?'chosen':''}" data-id="${r.id}"><input type="checkbox" data-select="${r.id}" aria-label="Select ${r.title}" ${chosen?'checked':''} ${progress?'disabled':''}><div class="wave" aria-hidden="true">≋</div><div class="record"><div class="title">${r.title}</div><div class="meta">${r.time} · ${r.duration} <span class="badge">${r.jobs?r.jobs+' linked '+(r.jobs===1?'transcript':'transcripts'):'No transcripts'}</span></div>${r.review?'<details class="notes"><summary>Review notes</summary><p>One source needs review. Original diagnostic details remain available here.</p></details>':''}</div>${!selected.size?`<div class="row-actions"><button class="quiet play" data-action="play" data-id="${r.id}" aria-label="Play ${r.title}" ${blocked?'disabled':''}>▶</button><button class="quiet transcribe" data-action="transcribe" data-id="${r.id}" ${blocked?'disabled':''}>Transcribe</button><button class="quiet" data-action="menu" data-id="${r.id}" aria-label="Actions for ${r.title}" aria-expanded="${menu===r.id}">•••</button></div>`:''}${menu===r.id?`<div class="menu" role="group" aria-label="Recording actions"><button data-action="local" data-id="${r.id}">Rename…</button><button data-action="transcribe" data-id="${r.id}" ${blocked?'disabled':''}>Transcribe</button><button data-action="local" data-id="${r.id}" ${blocked?'disabled':''}>Transcribe & summarize</button><button data-action="local" data-id="${r.id}">Source tracks…</button><button data-action="local" data-id="${r.id}" ${blocked?'disabled':''}>Verify / Recover</button><button data-action="local" data-id="${r.id}">Reveal in Finder</button><button data-action="local" data-id="${r.id}" ${blocked?'disabled':''}>Export…</button><hr><button class="danger" data-action="single-delete" data-id="${r.id}" ${blocked?'disabled':''}>Delete…</button></div>`:''}</article>`}
function sheet(){if(progress)return `<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">Moving recordings to Trash…</h2><p class="subtitle">Recording 2 of ${selected.size} · Finishing the current recording safely.</p><div class="progress" role="progressbar" aria-label="Deletion progress" aria-valuenow="1" aria-valuemin="0" aria-valuemax="${selected.size}"><span></span></div><p class="dim">1 recording moved · Remaining recordings are kept if you stop.</p><div class="loading-actions"><button data-action="stop">Stop after current recording</button></div></section></div>`;
const n=selected.size,j=jobs();return `<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description"><h2 id="dialog-title">Delete ${n} ${n===1?'recording':'recordings'}?</h2><p class="lead" id="dialog-description">Choose what moves to Trash. Nothing is permanently erased.</p><div class="choices"><label class="option ${scope==='audio'?'active':''}"><input type="radio" name="scope" value="audio" ${scope==='audio'?'checked':''}><span><strong>Recordings only</strong><p>Move audio, source tracks and recording files.<br>Keep all transcription data.</p></span></label><label class="option ${scope==='linked'?'active':''}"><input type="radio" name="scope" value="linked" ${scope==='linked'?'checked':''}><span><strong>Recordings + linked transcription data</strong><p>Also move ${j} verified ${j===1?'job':'jobs'}, including transcripts,<br>summaries, edits and generated job files.</p></span></label></div>${exceptions&&scope==='linked'?`<div class="warning"><strong>Some transcription data will be kept</strong><ul class="exception-list"><li>1 unverified job · source cannot be confirmed</li><li>1 raw Live draft · protected original evidence</li></ul><p>Review these separately. This action does not remove all transcription data.</p></div>`:''}<details class="scope"><summary>Review ${n} selected ${n===1?'recording':'recordings'}${scope==='linked'?' and linked data':''}</summary><ul>${rows.filter(x=>selected.has(x.id)).map(x=>`<li>${x.title}${scope==='linked'?' · '+x.jobs+' verified jobs':''}</li>`).join('')}</ul></details><div class="safe"><span aria-hidden="true">↶</span><p><strong>Recoverable in macOS Trash.</strong><br>Each recording stays together with its selected files.${scope==='linked'&&!exceptions?'<br>Only verified, finished jobs are included. Raw Live drafts are kept.':''}</p></div><div class="sheet-actions"><button data-action="cancel">Cancel</button><button class="danger" data-action="confirm">Move ${n} to Trash</button></div></section></div>`}
function render(focus){app.innerHTML=`<header class="chrome" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>RecScribe · Recordings</span></header><div class="content" ${modal?'inert':''}><div class="heading"><div class="library-icon" aria-hidden="true">▤</div><div><h1>Your recordings</h1><p>Listen, transcribe and make sense of your recordings.</p></div><div class="tools"><button data-action="local" ${blocked?'disabled':''}>Import…</button><button class="quiet" data-action="refresh">Refresh</button></div></div>${blocked?'<div class="banner">Recording in progress · Deletion is available after capture and background work finish.</div>':''}${result?'<section class="result" role="status"><strong>2 recordings and 3 transcript jobs moved to Trash</strong><p>1 recording could not be moved because its files are in use. It remains selected. No files from that recording were removed.</p><button class="quiet" data-action="local">Review failure details</button> <span class="dim">· Restore moved items from macOS Trash</span></section>':''}${rows.length?`<div class="toolbar" role="group" aria-label="Recording selection"><label class="master"><input id="master" type="checkbox" aria-label="Select all ${rows.length} recordings" ${selected.size===rows.length?'checked':''}><span>${rows.length} recordings</span></label><div class="right">${selected.size?`<span class="selected-count" role="status">${selected.size} selected</span><button class="quiet" data-action="clear">Clear</button>`:''}<button class="${selected.size?'danger':''}" data-action="delete" ${!selected.size||blocked?'disabled':''}>${selected.size?'Delete '+selected.size+'…':'Delete selected…'}</button></div></div><section aria-label="Recordings">${rows.map(row).join('')}</section>`:'<section class="empty"><h2>No recordings yet</h2><p>New recordings will appear here.</p><button data-action="local">Import WAV / session…</button></section>'}<footer class="footer" role="status"><span>${toast||'Ready'}</span><span class="end">${rows.length?rows.length+' recordings · '+rows.reduce((n,r)=>n+r.jobs,0)+' linked transcripts':''}</span></footer></div>${modal?sheet():''}`;
const master=app.querySelector('#master');if(master)master.indeterminate=selected.size>0&&selected.size<rows.length;
if(focus)app.querySelector(focus)?.focus({preventScroll:true});else if(modal)app.querySelector('[data-action="'+(progress?'stop':'cancel')+'"]').focus({preventScroll:true});}
function close(){modal=false;progress=false;render(returnFocus||'[data-action="delete"]')}
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=Number(b.dataset.id);
if(a==='clear'){selected.clear();render('#master')}
if(a==='delete'&&!blocked&&selected.size){returnFocus='[data-action="delete"]';modal=true;scope='audio';render()}
if(a==='single-delete'&&!blocked){selected=new Set([id]);menu=null;returnFocus='[data-action="delete"]';scope='audio';modal=true;render()}
if(a==='cancel')close();if(a==='menu'){menu=menu===id?null:id;render('[data-action="menu"][data-id="'+id+'"]')}
if(a==='confirm'&&!blocked){progress=true;render();timer=setTimeout(()=>{const count=selected.size,j=jobs();rows=rows.filter(r=>!selected.has(r.id));selected.clear();modal=false;progress=false;toast=count+' recordings'+(scope==='linked'?' and '+j+' transcript jobs':'')+' moved to Trash'+(scope==='audio'?'; transcription data kept':exceptions?'; 2 protected items kept':'');render('#master')},800)}
if(a==='stop'){clearTimeout(timer);modal=false;progress=false;toast='Stopped after current recording. Remaining recordings kept.';render('[data-action="delete"]')}
if(['local','refresh','play','transcribe'].includes(a)){toast=a==='refresh'?'Demo refreshed. Your selection is kept.':'Preview only · '+(b.textContent.trim()||'Playback')+' does not access files or audio.';menu=null;render()}});
app.addEventListener('change',e=>{if(e.target.id==='master'){selected=e.target.checked?new Set(rows.map(r=>r.id)):new Set();menu=null;render('#master')}else if(e.target.dataset.select){const id=Number(e.target.dataset.select),checked=e.target.checked;if(shiftClick&&anchor!==null){const indexes=[rows.findIndex(r=>r.id===anchor),rows.findIndex(r=>r.id===id)].sort((a,b)=>a-b);rows.slice(indexes[0],indexes[1]+1).forEach(r=>checked?selected.add(r.id):selected.delete(r.id))}else checked?selected.add(id):selected.delete(id);anchor=id;menu=null;render('[data-select="'+id+'"]')}else if(e.target.name==='scope'){scope=e.target.value;render('[name="scope"][value="'+scope+'"]')}});
// Keep modifier state from the checkbox click because change events omit shiftKey.
let shiftClick=false;app.addEventListener('click',e=>{if(e.target.matches('[data-select]'))shiftClick=e.shiftKey},true);
app.addEventListener('change',e=>{shiftClick=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal&&!progress){e.preventDefault();close()}else if(!modal&&menu){menu=null;render()}else if(!modal&&selected.size){selected.clear();render('#master')}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'&&!modal&&app.contains(document.activeElement)){e.preventDefault();selected=new Set(rows.map(r=>r.id));render('#master')}if(modal&&e.key==='Tab'){const focusables=[...app.querySelector('.sheet').querySelectorAll('button,input,summary')].filter(x=>!x.disabled);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
scene.onchange=()=>setScene(scene.value);const start=new URLSearchParams(location.search).get('scene')||'selected';scene.value=start;setScene(start);
})();
</script>
</html>
