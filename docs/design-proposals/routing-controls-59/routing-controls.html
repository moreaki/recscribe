<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RecScribe — Routing controls · #59 design preview</title>
<style>
:root{color-scheme:dark;--bg:#101116;--card:#1b1d24;--line:#30323b;--text:#e3e3e8;--dim:#96979f;--blue:#79b6ff;--orange:#ffa342;--mint:#79dac4;--field:#252832}
*{box-sizing:border-box}body{margin:0;padding:26px;background:#0b0c10;color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}button,select{color:inherit;background:var(--field);border:1px solid transparent;border-radius:8px;padding:8px 12px}button{cursor:pointer}button:hover:not(:disabled){background:#303540}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button[aria-pressed=true]{color:var(--orange);background:#3b2b20;border-color:#805026}h1,h2,h3,p{margin:0}h1{font-size:20px}h2{font-size:14px;color:var(--dim);font-weight:600}h3{font-size:17px;font-weight:650}small,.secondary{color:var(--dim)}.review{max-width:1200px;margin:0 auto 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}.review label{display:flex;align-items:center;gap:8px}.review p{flex-basis:100%;font-size:13px;color:var(--dim)}.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px}.tabs button{background:transparent}.tabs .selected{background:var(--field);color:var(--blue)}.app{max-width:1200px;margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:visible}.chrome{display:flex;align-items:center;gap:14px;padding:20px 26px;border-bottom:1px solid var(--line)}.logo{width:35px;height:35px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--mint);font-size:20px}.chrome .brand{font-size:17px;font-weight:700}.chrome .route{color:var(--dim);border-left:1px solid var(--line);padding-left:14px}.preview{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}.board{padding:24px 26px;display:grid;gap:26px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.heading .menu-wrap{margin-left:auto}.blue{color:var(--blue)}.list{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;position:relative;min-width:0}.card.muted{border-color:#97602c}.card.open{border-color:var(--blue)}.row{display:flex;align-items:center;gap:13px;padding:17px 18px;min-height:98px}.glyph{width:24px;flex:none;color:var(--dim);font-size:22px;text-align:center}.identity{flex:1;min-width:100px}.identity .secondary{font-size:13px;margin-top:3px;overflow-wrap:anywhere}.metrics{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--dim)}.controls{display:flex;gap:7px;align-items:center;flex:none}.mute{min-width:80px;font-size:13px;padding:7px 10px;border-color:#3d4553;background:#242a34;color:var(--blue)}.icon{width:30px;padding:4px 0;background:transparent;color:var(--dim);font-size:20px}.icon:hover:not(:disabled){color:var(--blue)}.chevron[aria-expanded=true]{transform:rotate(180deg)}.status{color:var(--orange);font-size:12px;margin-top:5px}.lower{display:grid;grid-template-columns:1fr 1fr;gap:28px}.lower section{min-width:0}.lower .row{flex-wrap:wrap;gap:10px;padding:17px 18px;min-height:112px}.lower .identity{min-width:135px}.lower .controls{margin-left:auto}.lower .metrics{font-size:12px}.helper{font-size:12px;color:var(--dim);margin-top:12px}.helper strong{color:var(--mint);font-weight:500}.details{padding:0 18px 18px}.details-inner{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:13px}.field{display:flex;justify-content:space-between;align-items:center;gap:12px}.field label{font-size:14px}.field output{margin-left:auto;color:var(--dim);font-size:13px}input[type=range]{width:100%;accent-color:var(--blue)}input[type=checkbox]{accent-color:var(--blue);width:17px;height:17px}.check{display:flex;align-items:center;gap:9px}.check small{margin-left:auto}.menu-wrap{position:relative}.menu{position:absolute;right:0;top:calc(100% + 8px);width:238px;padding:6px;border:1px solid #474b56;border-radius:10px;background:#252832;box-shadow:0 10px 30px #0008;z-index:8}.menu button{display:block;width:100%;text-align:left;background:transparent;font-size:13px;padding:10px}.menu .caption{padding:8px 10px;color:var(--dim);font-size:12px}.menu .destructive{color:#ff9c94}.menu hr{border:0;border-top:1px solid #3a3e48;margin:5px}.empty{border:1px dashed #414651;border-radius:12px;text-align:center;padding:32px 16px}.empty h3{font-size:18px}.empty p{font-size:13px;color:var(--dim);margin:6px 0 18px}.footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding:16px 26px;font-size:12px;color:var(--dim)}.footer .actions{display:flex;gap:8px}.record{background:#d6353d;color:white}.record:hover:not(:disabled){background:#e2464e}.monitor-toggle{font-size:12px;padding:5px 9px;border-color:#444c58;color:var(--mint)}.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#222d3b;border:1px solid #3c5b7d;border-radius:10px;font-size:13px}.banner button{margin-left:auto;font-size:12px}.notice{font-size:12px;color:var(--orange)}.toast{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:22px}.toast button{font-size:12px;padding:4px 10px}.meter{height:4px;border-radius:3px;background:#343740;margin-top:12px;overflow:hidden}.meter span{display:block;width:26%;height:100%;background:var(--mint)}[hidden]{display:none!important}
@media(max-width:920px){.lower{grid-template-columns:1fr}.lower .row{min-height:98px}.lower .identity{min-width:150px}}@media(max-width:600px){body{padding:10px}.board{padding:18px 14px;gap:22px}.chrome{padding:16px 14px;gap:9px}.chrome .route{font-size:13px;padding-left:9px}.preview{display:none}.row,.lower .row{padding:14px;flex-wrap:wrap;gap:9px}.glyph{width:18px;font-size:19px}.identity{min-width:150px}.controls,.lower .controls{width:calc(100% - 27px);margin-left:27px;justify-content:flex-end;flex-wrap:wrap}.metrics{margin-left:auto}h3{font-size:16px}.footer{padding:14px}.footer .actions{width:100%}.footer .actions button{flex:1}.menu{width:220px}.review{gap:8px}.review h1{width:100%}.review label{flex-wrap:wrap}button{min-height:36px}}
.studio-summary{max-width:420px;padding:4px 0 20px}.studio-summary h3{font-size:23px;margin:15px 0 10px}.studio-summary p{font-size:13px;color:var(--dim);margin:12px 0}.muted-source-list{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:14px 0}.source-badge{font-size:13px;line-height:1.5;color:var(--orange);background:#3b2b20;border-radius:7px;padding:6px 10px;max-width:100%;overflow-wrap:anywhere}.studio-summary small{display:block;font-size:12px}
</style>
</head>
<body>
<div class="review">
<h1>Routing controls · #59</h1>
<div class="tabs" role="group" aria-label="Design version"><button id="before" type="button">Current pattern</button><button id="after" type="button">Proposed</button></div>
<label>Scenario <select id="scenario"><option value="overview">Overview</option><option value="summary">Named Studio mute summary</option><option value="muted">Mute in collapsed cards</option><option value="menu">Remove source menu</option><option value="fixed">Fixed mix actions</option><option value="empty">No sources</option><option value="unavailable">Unavailable input</option><option value="capture">Recording in progress</option></select></label>
<button id="reset" type="button">Reset demo</button>
<p>Interactive design proposal. All audio, devices and recording states are simulated. No device access or audio playback. Changes stay in this browser only.</p>
</div>
<main class="app" aria-label="RecScribe audio routing design preview"></main>
<script>
(()=>{
const root=document.querySelector('.app');const key='recscribe-routing-59-demo-v1';
const catalog={system:{name:'System audio',detail:'All system playback → L / R',glyph:'⌁'},mic:{name:'MacBook Air Microphone',detail:'Hardware input · 1 channel → L + R',glyph:'♩'},usb:{name:'USB Microphone',detail:'Hardware input · 2 channels → L / R',glyph:'♩'}};
const names={...Object.fromEntries(Object.entries(catalog).map(([k,v])=>[k,v.name])),mix:'Stereo recording mix',monitor:'Headphone monitor',playback:'Recording playback'};
function initial(){return {sources:['system','mic'],muted:{},gain:{system:0,mic:0,usb:0,mix:0,monitor:50,playback:100},monitor:false}}
let config=initial(),mode='after',expanded=null,menu=null,capture=false,missing=false,summaryVisible=false,toast='',undo=null;
try{config=JSON.parse(localStorage.getItem(key))||initial()}catch{}
const params=new URLSearchParams(location.search);if(params.has('scene'))setScene(params.get('scene'));if(params.get('mode')==='before')mode='before';
function persist(){try{localStorage.setItem(key,JSON.stringify(config))}catch{}}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setScene(scene){config=initial();summaryVisible=scene==='summary';capture=false;missing=false;expanded=null;menu=null;toast='';undo=null;mode='after';
 if(scene==='muted'||scene==='summary'){config.muted.system=true;config.muted.mic=true;config.muted.monitor=true}
 if(scene==='menu')menu='mic';if(scene==='fixed')menu='mix';if(scene==='empty')config.sources=[];
 if(scene==='unavailable'){config.sources.push('usb');missing=true;menu='usb'}
 if(scene==='capture'){capture=true;config.monitor=true;config.muted.mic=true;menu='mic'}
 document.querySelector('#scenario').value=scene;
}
function muteControl(id,detail=false){return detail?`<label class="check"><input type="checkbox" data-mute="${id}" ${config.muted[id]?'checked':''}> ${id==='monitor'||id==='playback'?'Mute listening output':'Mute in mix'}<small>${id==='mix'?'Original tracks kept':catalog[id]?'Source still saved':'Listening only'}</small></label>`:`<button type="button" class="mute" data-action="mute" data-id="${id}" aria-label="${config.muted[id]?'Unmute':'Mute'} ${names[id]}${catalog[id]||id==='mix'?' in mix':''}" aria-pressed="${!!config.muted[id]}">${config.muted[id]?'Unmute':'Mute'}</button>`}
function menuContent(id){if(catalog[id])return `<button class="destructive" data-action="remove" data-id="${id}" ${capture?'disabled':''}>Remove source</button>${capture?'<div class="caption">Available after recording stops.</div>':'<div class="caption">Affects future capture. Saved recordings are kept.</div>'}`;
 if(id==='mix')return '<div class="caption">Required recording mix</div><button data-action="reset-level" data-id="mix">Reset mix settings</button><hr><div class="caption">The stereo mix stays in the recording pipeline. Original source tracks are kept separately.</div>';
 return `${id==='monitor'?`<button data-action="monitor-off" ${!config.monitor?'disabled':''}>Turn monitoring off</button>`:''}<button data-action="reset-level" data-id="${id}">Reset volume &amp; mute</button><hr><div class="caption">${id==='monitor'?'Optional listening. Turning it off stops monitoring.':'Playback remains available for saved recordings.'} Original recordings are unchanged.</div>`}
function details(id){const output=id==='monitor'||id==='playback';return `<div class="details" id="details-${id}"><div class="details-inner"><div class="field"><label for="gain-${id}">${output?'Listening volume':id==='mix'?'Master gain':'Input gain'}</label><output id="value-${id}">${value(id)}</output><button class="blue" data-action="reset-level" data-id="${id}">Reset</button></div><input id="gain-${id}" type="range" min="${output?0:-60}" max="${output?100:12}" value="${config.gain[id]}" data-gain="${id}" aria-label="${names[id]} ${output?'volume':'gain'}">${muteControl(id,true)}<p class="helper">${output?'Listening volume affects what you hear. It never changes recorded audio.':id==='mix'?'Source and master gain affect the derived mix. Original tracks stay at unity gain.':'All native channels remain in the original source track, even when muted in the mix.'}</p></div></div>`}
function value(id){return id==='monitor'||id==='playback'?config.gain[id]+'%':(config.gain[id]>=0?'+':'')+Number(config.gain[id]).toFixed(1)+' dB'}
function card(id){const data=catalog[id];const muted=config.muted[id];const name=names[id];const subtitle=data?(id==='usb'&&missing?'Unavailable input · reconnect or remove':data.detail):id==='mix'?'L / R · 48 kHz WAV':`${id==='monitor'?(config.monitor?'On':'Off')+' · ':''}System · MacBook Air Speakers`;
 return `<article class="card ${muted?'muted':''} ${expanded===id?'open':''}" data-card="${id}"><div class="row"><span class="glyph" aria-hidden="true">${data?data.glyph:id==='mix'?'☷':id==='monitor'?'◡':'▷'}</span><div class="identity"><h3>${name}</h3><div class="secondary">${subtitle}</div>${muted?`<div class="status">${data||id==='mix'?'Muted in mix':'Listening muted'}</div>`:''}</div><span class="metrics" data-metric="${id}">${value(id)}</span><div class="controls">${id==='monitor'&&mode==='after'?`<button class="monitor-toggle" data-action="monitor" aria-label="${config.monitor?'Disable':'Enable'} headphone monitoring" aria-pressed="${config.monitor}">${config.monitor?'Monitor on':'Monitor off'}</button>`:''}${mode==='after'?muteControl(id):''}${mode==='after'?`<div class="menu-wrap"><button class="icon" data-action="menu" data-id="${id}" aria-label="Actions for ${name}" aria-expanded="${menu===id}">⋯</button>${menu===id?`<div class="menu" aria-label="${name} actions">${menuContent(id)}</div>`:''}</div>`:''}<button class="icon chevron" data-action="expand" data-id="${id}" aria-label="Details for ${name}" aria-expanded="${expanded===id}" aria-controls="details-${id}">⌄</button></div></div>${expanded===id?details(id):`<div id="details-${id}" hidden></div>`}</article>`}
function addMenu(){const available=Object.keys(catalog).filter(id=>!config.sources.includes(id));return `<div class="menu-wrap"><button class="blue" data-action="menu" data-id="add" aria-expanded="${menu==='add'}" ${capture?'disabled':''}>＋ Add input</button>${menu==='add'?`<div class="menu" aria-label="Add source">${available.length?available.map(id=>`<button data-action="add" data-id="${id}" ${id==='usb'&&missing?'disabled':''}>${id==='system'?'Include system playback':catalog[id].name}${id==='usb'&&missing?' · unavailable':''}</button>`).join(''):'<div class="caption">All available sources are included.</div>'}</div>`:''}</div>`}
function studioSummary(){const muted=config.sources.filter(id=>config.muted[id]);const labels=mode==='before'?[...(muted.includes('system')?['Playback muted in mix']:[]),...(muted.filter(id=>id!=='system').length?[muted.filter(id=>id!=='system').length+' input muted in mix']:[])]:muted.map(id=>names[id]+' muted in mix');return `<section class="studio-summary" aria-label="Studio mute summary"><h2>Studio · capture summary</h2><h3>Ready when you are</h3><p>${config.sources.length} selected source routes → stereo recording mix</p><div class="muted-source-list" aria-live="polite">${labels.length?labels.map(label=>`<span class="source-badge">${escape(label)}</span>`).join(''):'<span class="secondary">No sources muted in mix.</span>'}</div>${config.muted.mix?'<span class="source-badge">Stereo recording mix muted</span>':''}<small>Mute affects the mix. Original source tracks are still saved.</small></section>`}
function render(focus){root.innerHTML=`<header class="chrome"><div class="logo" aria-hidden="true">⌁</div><span class="brand">RecScribe</span><span class="route">Audio routing</span><span class="preview">Design preview · #59 · ${mode==='after'?'proposed':'current pattern'}</span></header><div class="board">${summaryVisible?studioSummary():''}${capture?'<div class="banner">● Recording in progress <span class="secondary">Source changes are locked. Mute stays available.</span></div>':''}<section><div class="heading"><h2>Sources</h2>${addMenu()}</div><div class="list">${config.sources.length?config.sources.map(card).join(''):`<div class="empty"><h3>No sources selected</h3><p>Add system playback or an input to begin. Nothing is captured automatically.</p><button class="blue" data-action="menu" data-id="add">Choose a source</button></div>`}</div></section><div class="lower"><section><div class="heading"><h2>Recording mix</h2></div>${card('mix')}<p class="helper">${config.sources.length} selected source ${config.sources.length===1?'route':'routes'}${missing&&config.sources.includes('usb')?' · 1 unavailable':' · separate originals at unity gain'}</p><p class="helper"><strong>Mute changes the mix. Original source tracks are still saved.</strong></p></section><section><div class="heading"><h2>Outputs</h2></div><div class="list">${card('monitor')}${card('playback')}</div><p class="helper">Listening only · no change to saved audio</p></section></div></div><footer class="footer"><div class="toast" role="status" aria-live="polite">${toast?escape(toast):config.sources.length?'Ready to capture the selected sources.':'Add a source to enable recording and testing.'}${undo?`<button data-action="undo" ${capture?'disabled':''}>Undo removal</button>`:''}</div><div class="actions"><button data-action="test" ${!config.sources.length||capture?'disabled':''}>Test audio</button><button class="record" data-action="capture" ${!config.sources.length?'disabled':''}>${capture?'Stop demo recording':'Start demo recording'}</button></div></footer>`;
 document.querySelector('#before').classList.toggle('selected',mode==='before');document.querySelector('#after').classList.toggle('selected',mode==='after');
 document.querySelector('#before').setAttribute('aria-pressed',mode==='before');document.querySelector('#after').setAttribute('aria-pressed',mode==='after');
 if(focus){const target=[...root.querySelectorAll('button,input')].find(el=>el.dataset.action===focus.action&&el.dataset.id===focus.id||focus.mute&&el.dataset.mute===focus.mute);if(target)target.focus({preventScroll:true})}
}
root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const {action,id}=b.dataset;
 if(action==='menu'){menu=menu===id?null:id;render({action,id});return}
 if(action==='expand'){expanded=expanded===id?null:id;menu=null;render({action,id});return}
 if(action==='mute'){config.muted[id]=!config.muted[id]}
 if(action==='remove'&&!capture){undo=JSON.parse(JSON.stringify(config));config.sources=config.sources.filter(x=>x!==id);toast=names[id]+' removed. Saved recordings are kept.';menu=null;if(expanded===id)expanded=null}
 if(action==='add'&&!capture){if(!config.sources.includes(id))config.sources.push(id);menu=null;toast=names[id]+' added.'}
 if(action==='undo'&&!capture&&undo){config=undo;undo=null;toast='Source restored.'}
 if(action==='reset-level'){config.gain[id]=id==='monitor'?50:id==='playback'?100:0;config.muted[id]=false;menu=null;toast=names[id]+' settings reset.'}
 if(action==='monitor'){config.monitor=!config.monitor}
 if(action==='monitor-off'){config.monitor=false;menu=null}
 if(action==='capture'&&config.sources.length){capture=!capture;menu=null;toast=capture?'Simulated recording started. No audio is acquired.':'Simulated recording stopped.';if(!capture)config.monitor=false}
 if(action==='test'){toast='Simulated test only. No audio is acquired.'}
 persist();render({action,id});
});
root.addEventListener('change',e=>{const id=e.target.dataset.mute;if(!id)return;config.muted[id]=e.target.checked;persist();render({mute:id})});
root.addEventListener('input',e=>{const id=e.target.dataset.gain;if(!id)return;config.gain[id]=Number(e.target.value);root.querySelector('#value-'+id).textContent=value(id);root.querySelector('[data-metric="'+id+'"]').textContent=value(id);persist()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(menu){const id=menu;menu=null;render({action:'menu',id})}else if(expanded){const id=expanded;expanded=null;render({action:'expand',id})}}});
document.querySelector('#before').onclick=()=>{mode='before';menu=null;render()};document.querySelector('#after').onclick=()=>{mode='after';render()};
document.querySelector('#scenario').onchange=e=>{setScene(e.target.value);persist();render()};document.querySelector('#reset').onclick=()=>{setScene('overview');persist();render()};render();
})();
</script>
</body></html>
