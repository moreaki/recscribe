   if(!state.sheet)return '';
   if(state.sheet==='delete'){
    const selected=recordings.filter(r=>state.pendingIDs.includes(r.id)),jobs=selected.reduce((n,r)=>n+r.jobs,0),kept=selected.some(r=>r.draft);
    return `<dialog class="rs-sheet" aria-labelledby="rs-sheet-title"><div class="rs-sheet-inner"><div class="rs-eyebrow">Move to Trash</div><h2 id="rs-sheet-title">Delete ${selected.length} ${selected.length===1?'recording':'recordings'}?</h2><p class="rs-note">Choose what moves to Trash. Original files are recoverable from macOS Trash.</p><label class="rs-delete-option"><input type="radio" name="deleteScope" data-input="deleteScope" value="audio" ${state.deleteScope==='audio'?'checked':''}><span><strong>Recordings only</strong><small>Keep all transcripts, summaries and job artifacts.</small></span></label><label class="rs-delete-option"><input type="radio" name="deleteScope" data-input="deleteScope" value="linked" ${state.deleteScope==='linked'?'checked':''}><span><strong>Recordings + linked transcription data</strong><small>${jobs} verified ${jobs===1?'job':'jobs'} for the selected recordings, including complete job folders.</small></span></label>${state.deleteScope==='linked'&&kept?'<p class="rs-warning rs-small">A protected live draft will be kept. This does not remove all transcription data.</p>':''}<details><summary>Selected recordings</summary><ul>${selected.map(r=>`<li>${r.title}</li>`).join('')}</ul></details><div class="rs-sheet-actions">${b('Cancel','cancel-sheet','rs-secondary')}${b('Move '+selected.length+' to Trash','confirm-delete','rs-danger-button',state.session==='recording'?'disabled':'')}</div></div></dialog>`;
   }
   const definitions={download:['Download model?','The native confirmation shows the model, expected download size, source and SHA-256 verification. No recording is uploaded.','Confirm download'],connection:['Test OpenAI connection?','This explicit network action would use the configured Keychain key and load available models. It grants no approval to send audio or transcript content.','Test connection'],key:['Manage OpenAI key','The native secure field stores the key in Keychain. This mock accepts no credentials.','Close'],drafts:['Preserved live drafts','Live drafts retain raw evidence. Inspect ownership, linked sources and active-work restrictions before any cleanup.','Close']};
   const [title,description,primary]=definitions[state.sheet]||['Action preview','This action opens its native configuration or system dialog.','Close'];
   return `<dialog class="rs-sheet" aria-labelledby="rs-sheet-title"><div class="rs-sheet-inner"><h2 id="rs-sheet-title">${title}</h2><p class="rs-note">${description}</p><div class="rs-sheet-actions">${b('Cancel','cancel-sheet','rs-secondary')}${b(primary,'finish-sheet','rs-primary')}</div></div></dialog>`;
  }
  function auxiliary(){return state.mode==='recordings'?libraryView():state.mode==='routing'?routingView():settingsView();}
  d.render=function(){
   app.classList.toggle('rs-has-inspector',!!state.inspector&&state.mode==='studio');
   app.style.setProperty('--rs-body-size',design.readingSize+'px');app.style.setProperty('--rs-measure',design.readingWidth+'px');app.style.colorScheme=state.appearance==='system'?'light dark':state.appearance;
   app.innerHTML=`<div class="rs-chrome"><div class="rs-lights" aria-hidden="true"><span></span><span></span><span></span></div><span class="rs-brand">RecScribe</span><span class="rs-proposal">Focus · Interactive design</span><label class="rs-appearance">Preview ${options('appearance',[['system','System'],['light','Light'],['dark','Dark']],state.appearance)}</label></div><div class="rs-shell">${nav()}<main class="rs-main">${state.session==='recording'&&state.mode!=='live'?`<div class="rs-live-banner"><span><span class="rs-dot"></span>Recording · New session · 00:42</span><div class="rs-row">${b('Stop','global-stop','rs-small')}${b('Show Live →','live','rs-small')}</div></div>`:''}${state.mode==='studio'?studio():state.mode==='live'?live():auxiliary()}<div class="rs-status" role="status" aria-live="polite">${esc(state.notice)}${state.undoIDs?.length?b('Undo demo removal','undo-removal','rs-small'):''}</div></main></div>${sheet()}`;
   const master=app.querySelector('[data-input=master]');if(master)master.indeterminate=state.selected.length>0&&!filtered().every(r=>state.selected.includes(r.id));
   const dialog=app.querySelector('dialog');if(dialog){dialog.showModal();dialog.querySelector('[data-action=cancel-sheet]')?.focus();}
  };
  app.addEventListener('click',event=>{
   const trigger=event.target.closest('[data-action]');if(!trigger||trigger.disabled)return;
   const a=trigger.dataset.action;state.notice='';
   if(a.startsWith('category-')){state.settingsPage=a.slice(9);}
   else if(a.startsWith('lib-details-')){const id=a.slice(12);state.libDetails=state.libDetails===id?null:id;}
   else if(a==='lib-close')state.libDetails=null;
   else if(a.startsWith('lib-open-')){const r=recordings.find(r=>r.id===a.slice(9));state.mode='studio';state.title=r.title;state.newStudio=!r.jobs;state.inspector=null;}
   else if(a.startsWith('lib-play-'))state.libPlaying=a.slice(9);
   else if(a==='lib-stop')state.libPlaying=null;
   else if(a==='clear-selection')state.selected=[];
   else if(a==='delete-selected'||a.startsWith('lib-delete-')){if(state.session==='recording')return;state.pendingIDs=a==='delete-selected'?[...state.selected]:[a.slice(11)];state.deleteScope='audio';state.sheet='delete';}
   else if(a==='cancel-sheet'){state.sheet=null;}
   else if(a==='confirm-delete'){if(state.session==='recording')return;state.undoIDs=[...state.pendingIDs];state.removed=[...new Set([...state.removed,...state.pendingIDs])];state.selected=state.selected.filter(id=>!state.pendingIDs.includes(id));if(state.pendingIDs.includes(state.libDetails))state.libDetails=null;state.sheet=null;state.notice='Demo result: '+state.pendingIDs.length+' recordings moved to Trash'+(state.deleteScope==='linked'?' with verified linked jobs.':' · transcription data kept.');}
   else if(a==='undo-removal'){state.removed=state.removed.filter(id=>!state.undoIDs.includes(id));state.undoIDs=[];state.notice='Demo rows restored.';}
   else if(a==='test-sources'){if(state.session==='recording')return;state.test=!state.test;state.notice=state.test?'Synthetic input levels shown. No device is accessed and no file is saved.':'Source test stopped.';}
   else if(a.startsWith('mute-')){const id=a.slice(5);state.sourceSettings[id].muted=!state.sourceSettings[id].muted;}
   else if(a.startsWith('reset-')&&!['reset-master','reset-monitor','reset-playback'].includes(a)){const s=state.sourceSettings[a.slice(6)];s.gain=0;s.muted=false;s.trims=s.trims.map(()=>0);}
   else if(a.startsWith('route-')){if(state.test||state.session==='recording')return;const [,id,ch,side]=a.split('-');state.sourceSettings[id].routes[Number(ch)][Number(side)]=!state.sourceSettings[id].routes[Number(ch)][Number(side)];}
   else if(a==='virtual-add'||a==='virtual-remove'){if(state.test||state.session==='recording')return;state.virtualIncluded=a==='virtual-add';}
   else if(a==='monitor')state.monitor=!state.monitor;
   else if(a==='monitor-mute')state.monitorMute=!state.monitorMute;
   else if(a==='playback-mute')state.playbackMute=!state.playbackMute;
   else if(a==='reset-master')state.masterGain=0;
   else if(a==='reset-monitor'){state.monitorVolume=65;state.monitorMute=false;}
   else if(a==='reset-playback'){state.playbackVolume=80;state.playbackMute=false;}
   else if(a==='model-large'||a==='model-base')state.chosenModel=a==='model-large'?'large-v3-turbo':'base';
   else if(a==='download-model')state.sheet='download';
   else if(a==='test-cloud')state.sheet='connection';
   else if(a==='manage-key')state.sheet='key';
   else if(a==='manage-drafts')state.sheet='drafts';
   else if(a==='finish-sheet'){state.sheet=null;state.notice='Design preview only · no download, network action or settings change was performed.';}
   else if(a==='import'||a.startsWith('library-')||a.startsWith('lib-transcribe-')||a.startsWith('lib-summarize-')||['choose-folder','choose-ffmpeg','choose-vad','choose-whisper','choose-verification','detect-ai','detect-whisper','recheck-models','diagnostics-check','reveal-diagnostics','reveal-job'].includes(a)){state.notice='Preview: '+trigger.textContent.trim()+' opens the existing native workflow. No files, devices or services are accessed.';}
   else if(['studio','live','recordings'].includes(a)){state.mode=a;state.menu=null;}
   else if(['settings','routing'].includes(a)){state.returnMode=state.mode;state.mode=a;}
   else if(a==='return'){state.mode=state.returnMode||'studio';}
   else if(a==='review'||a==='review-source'){state.inspector=state.inspector==='review'&&a==='review'?null:'review';state.inspectorTrigger=a;if(a==='review-source')state.issue=0;}
   else if(a==='details'){state.inspector=state.inspector==='details'?null:'details';state.inspectorTrigger=a;}
   else if(a==='close')state.inspector=null;
   else if(a==='previous'||a==='next')state.issue=1-state.issue;
   else if(a.startsWith('item-'))state.issue=Number(a.slice(5));
   else if(a==='check'){if(!state.checked.includes(state.issue))state.checked.push(state.issue);state.notice='Review saved in this demo. Original source text is unchanged.';}
   else if(a==='reopen')state.checked=state.checked.filter(id=>id!==state.issue);
   else if(a==='all-items')state.showChecked=!state.showChecked;
   else if(a==='summary'||a==='transcript')state.tab=a;
   else if(a==='channels')state.channels=!state.channels;
   else if(a==='play')state.playing=!state.playing;
   else if(a==='follow')state.follow=!state.follow;
   else if(a.startsWith('seek-')){state.position=Number(a.slice(5));state.notice='Playback positioned at '+clock(state.position)+' · simulated audio';}
   else if(a==='listen'){state.position=22;state.playing=true;state.notice='Playing 00:22–00:24 · simulated audio';}
   else if(a==='summary-source'||a==='summary-last-source'){state.tab='transcript';state.position=a==='summary-source'?17:39;state.notice='Showing linked transcript passage at '+clock(state.position);}
   else if(a==='export'||a==='process')state.menu=state.menu===a?null:a;
   else if(a==='close-menu')state.menu=null;
   else if(a==='rename')state.rename=true;
   else if(a==='save-title'){state.title=app.querySelector('[data-input=title]').value.trim()||'Untitled recording';state.rename=false;}
   else if(a==='start'){state.session='recording';state.playing=false;state.libPlaying=null;state.test=false;}
   else if(a==='stop')state.session='saved';
   else if(a==='global-stop'){state.session='saved';state.notice='Live recording saved. Studio selection retained.';}
   else if(a==='finish'){state.title='New session · Today';state.mode='studio';state.inspector=null;state.tab='transcript';state.newStudio=true;state.notice='Saved session opened. Final transcription has not run.';}
   else if(a==='new-session')state.session='ready';
   else if(a.startsWith('open-')){state.mode='studio';state.newStudio=false;state.title=['Community interview','Team planning','Research notes'][Number(a.slice(5))];state.notice='Sample recording opened in Studio.';}
   else if(a==='create-final'){state.newStudio=false;state.checked=[];state.notice='Synthetic final transcript created for layout review. No audio was processed.';}
   else if(a==='copy-plain'||a==='copy-markdown'){state.notice='Copy '+(a==='copy-plain'?'plain text':'Markdown')+' selected · simulated export';state.menu=null;}
   else if(a==='share'){state.notice='Share current '+state.tab+' · simulated system share sheet';state.menu=null;}
   else if(a==='retry'||a==='improve'){state.notice=(a==='retry'?'Transcription':'Text processing')+' setup opens here, with source/version and any cloud approval before running. Demo only.';state.menu=null;}
   else if(a==='reveal')state.notice='Show source file in Finder · simulated; no local recording is opened.';
   d.render();persist();
   let focusTarget;
   if(['review','review-source','details'].includes(a)&&state.inspector)focusTarget=app.querySelector('[data-action=close]');
   if(a==='close')focusTarget=app.querySelector(`[data-action="${state.inspectorTrigger||'review'}"]`);
   if(a==='rename')focusTarget=app.querySelector('[data-input=title]');
   if(a==='check')focusTarget=app.querySelector('[data-action=reopen]');
   if(a==='stop')focusTarget=app.querySelector('[data-action=finish]');
   focusTarget?.focus({preventScroll:true});
  });
  app.addEventListener('change',event=>{
   const el=event.target,kind=el.dataset.input;if(!kind)return;
   if(kind==='master')state.selected=el.checked?[...new Set([...state.selected,...filtered().map(r=>r.id)])]:state.selected.filter(id=>!filtered().some(r=>r.id===id));
   else if(kind==='select'){if(el.checked)state.selected=[...new Set([...state.selected,el.dataset.id])];else state.selected=state.selected.filter(id=>id!==el.dataset.id);}
   else if(kind==='gain')state.sourceSettings[el.dataset.source].gain=Math.max(-60,Math.min(24,Number(el.value)));
   else if(kind==='hardware')state.sourceSettings[el.dataset.source].hw=Math.max(0,Math.min(100,Number(el.value)));
   else if(kind==='trim')state.sourceSettings[el.dataset.source].trims[Number(el.dataset.channel)]=Math.max(-60,Math.min(24,Number(el.value)));
   else if(kind==='deleteScope')state.deleteScope=el.value;
   else if(kind==='position')state.position=Number(el.value);
   else if(['liveText','autoTranscribe','aiEnabled','summaryAuto'].includes(kind))state[kind]=el.checked;
   else if(['masterGain','monitorVolume','playbackVolume'].includes(kind))state[kind]=Number(el.value);
   else if(['appearance','archive','provider','textMode','playbackCapture','query'].includes(kind))state[kind]=el.value;
   else if(kind==='processingLocation'){state.processingLocation=el.value;if(state.session==='recording')state.liveText=false;state.notice='Processing location changed in the mock. Audio approval is revoked; this does not approve any upload.';}
   else if(kind!=='title'){state.preferences[kind]=el.value;state.notice='Preference changed in this design preview only.';}
   if(kind!=='title'){d.render();persist();}
  });
  app.addEventListener('input',event=>{if(event.target.dataset.input==='query'){const value=event.target.value,position=event.target.selectionStart;state.query=value;d.render();const input=app.querySelector('[data-input=query]');input.focus();input.setSelectionRange(position,position);}});
  app.addEventListener('cancel',event=>{event.preventDefault();state.sheet=null;d.render();persist();},true);
  app.addEventListener('keydown',event=>{if(event.key==='Escape'){state.sheet=null;state.menu=null;state.inspector=null;state.rename=false;d.render();app.querySelector(`[data-action="${state.inspectorTrigger||'review'}"]`)?.focus();persist();}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='a'&&state.mode==='recordings'&&!['INPUT','TEXTAREA'].includes(event.target.tagName)){event.preventDefault();state.selected=filtered().map(r=>r.id);d.render();persist();}if(['ArrowLeft','ArrowRight'].includes(event.key)&&event.target.getAttribute('role')==='tab'){event.preventDefault();state.tab=state.tab==='transcript'?'summary':'transcript';d.render();app.querySelector(`[data-action=${state.tab}]`)?.focus();persist();}});
  d.render();
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>d.render()});tweak.addSlider(design,'readingSize',{label:'Reading size',min:15,max:20,step:1,unit:'px'});tweak.addSlider(design,'readingWidth',{label:'Reading width',min:500,max:740,step:20,unit:'px'});}
 }
 globalThis.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(!next)return;for(const d of demos)if(next[d.name]){Object.assign(d.state,next[d.name]);d.render();}});
})();
</script>
