[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recscribe-pipeline"
version = "0.1.0"
description = "Local, auditable WAV transcription orchestration for RecScribe"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "numpy>=2,<3"]
license = "Apache-2.0"

[project.scripts]
recscribe = "recscribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recscribe = ["transcript.schema.json"]
